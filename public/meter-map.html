// Up to 1000% so small rooms on the floor plan can be read on a phone.
const MAX_ZOOM=1000;function setZoom(n){zoom=Math.max(100,Math.min(MAX_ZOOM,n));const v=document.querySelector('.viewport'),base=Math.min(v.clientWidth,v.clientHeight*716/288);$('map').style.width=Math.max(1,base)*zoom/100+'px';$('zoomLevel').textContent=Math.round(zoom)+'%';$('zoomOut').disabled=zoom===100;$('zoom').disabled=zoom===MAX_ZOOM;}$('zoom').onclick=()=>setZoom(zoom+50);$('zoomOut').onclick=()=>setZoom(zoom-50);$('fit').onclick=()=>setZoom(100);setZoom(100);
draw();
// On phones the side-by-side layout follows how the phone is held; the keyboard makes this frame wide but must not switch layouts.
function orient(){const phone=matchMedia('(pointer:coarse)').matches,type=screen.orientation?.type||'';document.documentElement.classList.toggle('landscape',phone?(type?type.startsWith('landscape'):Math.abs(window.orientation||0)===90):innerWidth>innerHeight);}

const viewport=document.querySelector('.viewport');let viewWidth=0,lastBlur=0;
document.addEventListener('focusout',e=>{if(e.target.closest?.('#entries'))lastBlur=Date.now();});
// While the phone keyboard is open the parent sends this page's pre-keyboard height: the layout keeps that size and the page scrolls.
let keyboardHeight=0;
// The compact short-screen layout is for a phone held sideways, not for the keyboard: it never switches while typing.
function shortScreen(force){const typing=Boolean(document.activeElement?.closest?.('#entries'))||Date.now()-lastBlur<1500;if(!keyboardHeight&&(force||!typing))document.documentElement.classList.toggle('short',innerHeight<=420);}
shortScreen(true);addEventListener('resize',()=>shortScreen());
function revealInput(){const el=document.activeElement;if(!keyboardHeight||!el?.closest?.('#entries'))return;const r=el.getBoundingClientRect(),m=12,se=document.scrollingElement;if(r.bottom>innerHeight-m)se.scrollTop+=Math.min(r.bottom-innerHeight+m,r.top-m);else if(r.top<m)se.scrollTop+=r.top-m;}

// The map and the input pane keep the frame's height (the pre-keyboard height while typing) whenever the page scrolls.

fullHeight=innerHeight;addEventListener('resize',()=>{const typing=Boolean(document.activeElement?.closest?.('#entries'))||Date.now()-lastBlur<1500;if(keyboardHeight||typing)return;fullHeight=innerHeight;if(hist)sizeMain();});
new ResizeObserver(()=>{

viewport.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;if(!drag.moved){drag.moved=true;viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');}viewport.scrollLeft=drag.left-dx;viewport.scrollTop=drag.top-dy;e.preventDefault();});

window.addEventListener('message',e=>{
 if(e.source!==parent||e.origin!==location.origin)return;const d=e.data;
 if(d?.type==='meter-map-keyboard'){setKeyboard(d.height);return;}
 if(d?.type==='meter-map-layout-result'){
  layoutBusy=false;
  if(d.error){points=valid(canonicalPoints);selected=null;$('reading').hidden=true;$('editor').hidden=true;draw();status(d.error+' 配置は保存されていません。');}
  else{layoutVersion=d.meterMap.version;canonicalPoints=valid(d.meterMap.points);points=valid(canonicalPoints);draw();status('配置を保存しました。ほかのユーザーにも共通のマップとして表示されます。');}

 if($('date').value!==d.date){draft={};touched={};}saved=d.current||{};for(const [id,value] of Object.entries(draft)){if(value!==''&&Number.isFinite(Number(value))&&Number(value)===d.current?.[id])delete draft[id];}values={[d.previousDate]:d.previous,[d.date]:{...d.values,...draft}};liveFormulas=d.formulas||{};$('date').value=d.date;$('actualDate').textContent='検針日：'+d.date.replaceAll('-','/');

 entries();for(const i of $('entries').querySelectorAll('input'))i.disabled=Boolean(liveFormulas[i.dataset.id])||d.saving;saving=d.saving===true;progress();
 if(first&&isAdmin&&!monthly&&layoutVersion===0&&!points.length){
  try{const legacy=valid(JSON.parse(localStorage.getItem(K)||'{}').points||[]);if(legacy.length&&confirm('この端末に登録済みの'+legacy.length+'か所の配置を、全員共通のマップとして登録しますか？')){points=legacy;draw();store();}}catch{status('以前の配置を確認できませんでした。管理者が位置を登録してください。');}

});

let touchGesture=null;
function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

viewport.addEventListener('touchmove',e=>{if(!touchGesture)return;const ts=e.touches,g=touchGesture;if(g.type==='pinch'&&ts.length>=2){e.preventDefault();const r=viewport.getBoundingClientRect(),x=(ts[0].clientX+ts[1].clientX)/2-r.left,y=(ts[0].clientY+ts[1].clientY)/2-r.top;setZoom(g.zoom*touchDistance(ts[0],ts[1])/g.distance);const mapRect=$('map').getBoundingClientRect();viewport.scrollLeft=g.anchorX*mapRect.width-x;viewport.scrollTop=g.anchorY*mapRect.height-y;}else if(g.type==='pan'&&ts.length===1){const dx=ts[0].clientX-g.x,dy=ts[0].clientY-g.y;if(Math.hypot(dx,dy)>5)g.moved=true;if(g.moved){e.preventDefault();viewport.scrollLeft=g.left-dx;viewport.scrollTop=g.top-dy;if(keyboardHeight||hist)document.scrollingElement.scrollTop=g.page+(g.top-dy-viewport.scrollTop);}}},{passive:false});
